const products=[{"name":"Forest Current","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-som-abs-01-original-raster-preview-1049x1499.png?v=1793604317"},{"name":"Ochre Moon","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-02-uncropped-source-artwork.png?v=1793605417"},{"name":"Coastal Light","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-som-abs-03-original-raster-preview-1049x1499.png?v=1793604327"},{"name":"Rust Gesture","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-04-uncropped-source-artwork.png?v=1793605427"},{"name":"Still Olive","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-05-uncropped-source-artwork.png?v=1793605438"},{"name":"Blue Orbit","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-som-abs-06-original-raster-preview-1049x1499.png?v=1793604336"},{"name":"Lemon Study","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-07-uncropped-source-artwork.png?v=1793605448"},{"name":"Terracotta Passage","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-som-abs-08-original-raster-preview-1049x1499.png?v=1793604346"},{"name":"Soft Horizon","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-09-uncropped-source-artwork.png?v=1793605458"},{"name":"Blue Coast","img":"https://cdn.shopify.com/s/files/1/1091/2088/0974/files/somnula-v15-10-uncropped-source-artwork.png?v=1793605467"}];
const variants=[['35 × 50 cm',79],['50 × 70 cm',129],['70 × 100 cm · Fine Art',229],['70 × 100 cm · Wide mount',319],['100 × 140 cm · Ultra-wide mount',549]];
const stage=document.getElementById('stage'),drawer=document.getElementById('drawer'),choices=document.getElementById('choices');
products.forEach((p,i)=>{let b=document.createElement('button');b.className='piece';b.setAttribute('aria-label',p.name);let img=document.createElement('img');img.src=p.img;img.alt=p.name;img.loading=i<4?'eager':'lazy';b.append(img);b.onclick=()=>{document.getElementById('detail-img').src=p.img;document.getElementById('detail-name').textContent=p.name;choices.replaceChildren();variants.forEach(([title,price],j)=>{let c=document.createElement('button');c.className='choice'+(j===0?' active':'');c.textContent=title+' / €'+price;c.onclick=()=>{choices.querySelectorAll('button').forEach(x=>x.classList.remove('active'));c.classList.add('active');document.getElementById('price').textContent='€'+price};choices.append(c)});document.getElementById('price').textContent='€79';drawer.classList.add('open')};stage.append(b)});

name: UI and i18n smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'investors/**'
      - 'shared/**'
      - 'functions/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/ui-smoke.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'investors/**'
      - 'shared/**'
      - 'functions/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ui-i18n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run test:i18n
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 >/tmp/oido-http.log 2>&1 &
          echo $! > /tmp/oido-http.pid
          sleep 2
      - run: npm run test:ui
      - name: Verify fixed receipts and scroll-idle motion
        run: node tests/motion-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: artifacts/ui
          if-no-files-found: ignore

name: Lead form browser tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/lead-form.spec.js"
      - "playwright.config.js"
      - ".github/workflows/lead-form-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev @playwright/test@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start site
        run: python3 -m http.server 4173 > /tmp/oido-http.log 2>&1 &
      - name: Run browser tests
        run: npx playwright test tests/lead-form.spec.js

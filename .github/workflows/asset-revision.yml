name: Refresh shared asset revision

on:
  push:
    branches: [main]
    paths:
      - 'shared/oido-i18n.js'
      - 'shared/oido-i18n.css'
      - 'shared/oido-brand-spot.js'
      - 'shared/oido-brand-spot.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oido-asset-revision
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh shared asset cache keys and logo protection
        env:
          REV: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,re
          rev=os.environ['REV'][:8]
          files=['index.html','investors/index.html']
          assets=['oido-i18n.css','oido-i18n.js','oido-brand-spot.css','oido-brand-spot.js']
          for path in files:
              text=open(path,encoding='utf-8').read()
              for asset in assets:
                  pattern=rf'((?:\.\./|\./)shared/{re.escape(asset)})(?:\?v=[^"\']+)?'
                  text=re.sub(pattern,lambda m:m.group(1)+'?v='+rev,text)
              text=text.replace('class="brand oido-brand-spot"', 'class="brand oido-brand-spot notranslate" translate="no"')
              open(path,'w',encoding='utf-8').write(text)
          PY
      - name: Commit revision
        run: |
          if git diff --quiet -- index.html investors/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html investors/index.html
          git commit -m "Refresh Oído shared asset revision"
          git push

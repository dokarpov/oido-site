<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Написать Дарье Карповой</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#1b1b1b;background:white}
main{max-width:470px;margin:10vh auto 0}h1{font-size:26px;line-height:1.2;letter-spacing:-.02em}p{line-height:1.6;color:#555}
a.btn{display:block;margin-top:26px;padding:16px 20px;text-align:center;border-radius:9px;text-decoration:none;color:white;background:#161616;font-weight:600}
.small{font-size:13px}a{color:#161616}
</style>
</head>
<body>
<main>
<h1>Открываем письмо…</h1>
<p id="desc">Тема и короткий бриф для оценки стоимости уже подготовлены.</p>
<a class="btn" id="email" href="mailto:dokarpov@gmail.com">Открыть письмо</a>
<p class="small">Если почтовое приложение не открылось автоматически, нажмите кнопку. <a href="https://t.me/dokarpov">Или напишите в Telegram</a>.</p>
</main>
<script>
(function(){
  const jobs = {
    s:["Сайт, лендинг, Shopify","Ссылка на проект:\nЧто необходимо сделать:\nЧто уже есть:\nСроки:"],
    a:["Приложение, SaaS, FinTech, EdTech","Идея и пользователи:\nКакие функции нужны:\nЧто уже готово:\nСроки:"],
    m:["MVP и демо для продаж","Кому показывать:\nКакие сценарии должны работать:\nЧто уже есть:\nДата презентации:"],
    c:["AI, боты, CRM, интеграции","Какой процесс автоматизировать:\nКакие системы используются:\nКакой результат нужен:\nСроки:"],
    g:["Конверсия, онбординг, рост","Ссылка на продукт:\nГде теряются клиенты:\nКакие данные есть:\nСроки:"],
    r:["Исследование, стратегия, рынок","Продукт и рынок:\nЧто нужно выяснить:\nКакое решение предстоит принять:\nСроки:"],
    v:["Бренд, UI, графика, ASO","Что необходимо создать:\nДля какой аудитории:\nРеференсы и материалы:\nСроки:"],
    b:["Балкон или терраса","Адрес или район:\nРазмеры и фотографии:\nЧто хочется изменить:\nСроки:"],
    i:["Интерьер, планировка, свет","Тип пространства и площадь:\nПлан или фотографии:\nЧто нужно изменить:\nСроки:"],
    f:["Архитектура, коммерческое пространство, 3D","Тип и площадь объекта:\nКакая задача:\nПланы или чертежи:\nСроки:"],
    p:["Недвижимость, comunidad, коммуникации","Ссылка на объект или адрес:\nКакие вопросы или риски:\nДокументы или фотографии:\nСроки:"],
    w:["Ремонт, материалы, поставщики, закупки","Адрес или район:\nЧто требуется сделать или закупить:\nТекущая стадия:\nСроки:"],
    t:["Декор, арт, апсайклинг","Что за объект или пространство:\nФото или референсы:\nКаким должен быть результат:\nСроки:"],
    x:["Бесплатно: autónomo и бюрократия","Коротко о ситуации:\nКакой совет нужен:\nЧто уже предпринимали:"],
    o:["ASO и страницы приложений","Ссылка на приложение:\nРынок и язык:\nКакие материалы нужны:\nСроки:"],
    q:["Питч, презентация, коммерческое предложение","Кто аудитория:\nЧто хотите получить:\nКакие материалы есть:\nСроки:"],
    k:["Подбор материалов, света, мебели","Объект и район:\nЧто ищем:\nРазмеры и фотографии:\nСроки:"],
    d:["3D-модели, рендеры, визуализации","Что визуализируем:\nЧертежи, фото, размеры:\nНужные виды:\nСроки:"],
    n:["Поставщики и закупки","Что требуется найти или закупить:\nОбъёмы и доставка:\nСроки:"],
    z:["Ремонт и сопровождение стройки","Объект и локация:\nОбъём работ:\nПодрядчики и стадия:\nСроки:"]
  };
  const code=new URLSearchParams(location.search).get("j")||"";
  const valid=Object.prototype.hasOwnProperty.call(jobs,code);
  const job=valid?jobs[code]:["Запрос по проекту","Что необходимо сделать:\nЧто уже есть:\nСроки:"];
  const subject=(code==="x"?"Вопрос":"Запрос")+" — "+job[0];
  const body="Здравствуйте, Дарья!\n\n"+job[1]+"\n\nСпасибо!";
  const url="mailto:dokarpov@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  document.title="Письмо: "+job[0];
  document.getElementById("email").href=url;
  document.getElementById("desc").textContent=(code==="x"?"Личный опыт, не юридическая или налоговая консультация.":"Заготовлен короткий бриф для оценки стоимости.")+" Если письмо не открылось автоматически, нажмите кнопку ниже.";
  window.setTimeout(function(){window.location.href=url;},150);
})();
</script>
</body></html>
